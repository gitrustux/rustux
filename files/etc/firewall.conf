# The firewall (netd; man firewall.conf, man fwctl). Rules are about new
# conversations; answers to what this computer sent always pass, and lo is
# never filtered. First match wins, then the default.
#
#   allow|deny in|out tcp|udp|icmp|any [PORT[-PORT]] [from|to ADDRESS[/PREFIX]]
#   default in|out allow|deny
#   enabled yes|no
#
# fwctl changes the running rules; fwctl save writes them here.
enabled yes
default in deny
default out allow
# SSH, and pings
allow in tcp 22
allow in icmp
