# The network interfaces at boot (docs/NETWORK.md, man network.conf).
# netd names the cards eth0, eth1, ... in the order their drivers start.
#
#   NAME static ADDRESS/PREFIX [GATEWAY]
#   NAME dhcp                  (step D3: not yet)
#
# `ip` changes the running state; this file is read when netd starts.
#
# QEMU's user-mode network (-netdev user): 10.0.2.15, the gateway 10.0.2.2
eth0 static 10.0.2.15/24 10.0.2.2
