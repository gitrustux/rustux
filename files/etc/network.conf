# The network interfaces at boot (docs/NETWORK.md, man network.conf).
# netd names the cards eth0, eth1, ... in PCI order (ip link).
#
#   NAME dhcp                          an address from a DHCP server
#   NAME static ADDRESS/PREFIX [GATEWAY]
#   NAME off                           left alone
#   dns ADDRESS...                     DNS servers besides DHCP's
#   search DOMAIN...                   domains tried for short names
#
# A card without a line gets DHCP. netcfg (and Settings > Network)
# change this file and apply it at once; after editing it by hand:
# sudo netcfg apply. `ip` changes the running state without the file.
eth0 dhcp
# eth0 static 10.0.2.15/24 10.0.2.2
# dns 10.0.2.3
