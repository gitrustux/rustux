[package]
name = "tools"
version = "0.1.0"
edition = "2021"
description = "Rustux commands in one multi-call program: grep, less, man, edit, tar, gzip, find, xargs, diff"
license = "MIT"

[dependencies]
regex = "1"
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
findutils = { path = "../vendor/findutils" }
kibi = { path = "../vendor/kibi" }
diffutilslib = { package = "diffutils", path = "../vendor/diffutils" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[patch.crates-io.platform-info]
path = "../vendor/platform-info"
