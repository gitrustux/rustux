[package]
name = "rpg"
version = "0.1.0"
edition = "2021"
description = "Rustica's package tool (phase E, PACKAGES.md): .rpg packages, the package database, signed repositories"
license = "MIT"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.11", default-features = false }
ed25519-dalek = "3.0"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "0.26"

[profile.release]
panic = "abort"
opt-level = "s"
