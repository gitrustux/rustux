[package]
name = "rpg"
version = "0.1.0"
edition = "2021"
description = "Rustica's package tool (phase E, PACKAGES.md): .rpg packages, the package database"
license = "MIT"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.11", default-features = false }

[profile.release]
panic = "abort"
opt-level = "s"
